# --- get.bambuddy.cool ------------------------------------------------
#
# The appliance is sold through Paddle, whose domain review wants a site about
# the product and nothing else, so it has its own subdomain. (Not
# appliance.bambuddy.cool: that host is the licence registrar, which appliances
# and Bambuddy Orders installs call, and it stays exactly as it is.) Its pages live in
# appliance/ in this repo (built by tools/build_appliance_site.py); css, fonts,
# js, assets and img there are symlinks to the main site's folders, so nginx
# must follow symlinks (the default: disable_symlinks off).
#
# The web root is the appliance/ folder of the website checkout on the nginx
# host, /opt/bambuddy-website. Then:
#
#   1. Issue the certificate first -- the 443 block below fails nginx -t without
#      it. Same way as the other bambuddy.cool subdomains on this host (DNS-01
#      via Porkbun, see the registrar's nginx file), so nginx is not involved:
#        certbot certonly --authenticator dns-porkbun \
#          --dns-porkbun-credentials /etc/letsencrypt/porkbun.ini \
#          --dns-porkbun-propagation-seconds 60 -d get.bambuddy.cool
#   2. sudo cp nginx-get-subdomain.conf /etc/nginx/sites-available/get.bambuddy.cool
#      sudo ln -s ../sites-available/get.bambuddy.cool /etc/nginx/sites-enabled/
#   3. sudo nginx -t && sudo systemctl reload nginx
#   4. Add the redirects at the bottom to the bambuddy.cool server block.
#
# The leadform rate-limit zone is the one nginx-bug-relay.conf already defines.

server {
    listen 80;
    listen [::]:80;
    server_name get.bambuddy.cool;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name get.bambuddy.cool;

    ssl_certificate     /etc/letsencrypt/live/get.bambuddy.cool/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/get.bambuddy.cool/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000" always;

    access_log /var/log/nginx/get.bambuddy.cool.access.log;
    error_log  /var/log/nginx/get.bambuddy.cool.error.log;

    root /opt/bambuddy-website/appliance;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # The enquiry form posts to /api/lead on its own origin; same relay as the
    # main site.
    location /api/lead {
        limit_req zone=leadform burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:5050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64k;
    }

    # Matomo. js/cookie-consent.js loads the tracker from /t/ on the page's own
    # origin, which the main site proxies; without these the shop records
    # nothing. Only the two tracker files, not the whole of /t/: this host has
    # no reason to serve Matomo's login page.
    location = /t/t.js {
        proxy_pass http://192.168.253.3:8090/matomo.js;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /t/t.php {
        proxy_pass http://192.168.253.3:8090/matomo.php;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- in the existing bambuddy.cool server {} block -------------------------
#
# The old appliance page moved. appliance.html stays in the repo as the source
# the subdomain is built from, so without this rule the main site would still
# serve a copy of it.
#
#   location = /appliance.html {
#       return 301 https://get.bambuddy.cool/$is_args$args;
#   }
#
# And keep the subdomain's folder off the main site:
#
#   location ^~ /appliance/ {
#       return 301 https://get.bambuddy.cool/;
#   }
